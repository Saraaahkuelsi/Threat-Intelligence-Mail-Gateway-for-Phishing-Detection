[main]
; Mode observation par défaut : détecte et journalise, mais ne bloque
; pas l'email. Passer à true une fois le plugin validé, pour un
; vrai blocage actif des emails contenant un IOC malveillant connu.
deny_on_malicious=true

; Adresse de l'API FastAPI (main.py)
api_host=127.0.0.1
api_port=8000
